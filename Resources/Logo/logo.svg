<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Display Manager App-Icon: zwei ineinandergreifende Bildschirme -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4c9b"/>
      <stop offset="1" stop-color="#101a3a"/>
    </linearGradient>
    <linearGradient id="screenA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe0ff"/>
    </linearGradient>
    <linearGradient id="screenB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd4ff"/>
      <stop offset="1" stop-color="#2a9df4"/>
    </linearGradient>
    <mask id="mA" maskUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120">
      <rect x="-10" y="-10" width="120" height="120" fill="#fff"/>
      <line x1="48" y1="46" x2="48" y2="60" stroke="#000" stroke-width="14"/>
    </mask>
    <mask id="mB" maskUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120">
      <rect x="-10" y="-10" width="120" height="120" fill="#fff"/>
      <line x1="64" y1="30" x2="64" y2="44" stroke="#000" stroke-width="14"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
  <g transform="translate(512 512) scale(6.2) translate(-48 -48)" filter="url(#shadow)"
     fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <g mask="url(#mA)" stroke="url(#screenA)">
      <rect x="0" y="13" width="64" height="40" rx="5"/>
      <path d="M32 53V64M26 64H38"/>
    </g>
    <g mask="url(#mB)" stroke="url(#screenB)">
      <rect x="48" y="37" width="48" height="36" rx="5"/>
      <path d="M72 73V83M65 83H79"/>
