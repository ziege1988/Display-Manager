name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift-Version
        run: swift --version

      - name: App bauen
        run: ./Scripts/build_app.sh "0.0.0" "${{ github.run_number }}"

      - name: Build-Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Display-Manager-build-${{ github.run_number }}
          path: build/Display-Manager.zip
          retention-days: 14
