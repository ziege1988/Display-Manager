name: Release

# Neues Release erstellen: GitHub › Actions › „Release“ › „Run workflow“ › Version eingeben (z. B. 1.0.0).
# Die installierten Apps finden das Release automatisch und aktualisieren sich.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer (z. B. 1.0.0)"
        required: true
      notes:
        description: "Was ist neu? (optional – sonst automatisch aus den Commits)"
        required: false
      prerelease:
        description: "Als Vorabversion markieren (wird nicht automatisch installiert)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
      HAS_CERT: ${{ secrets.SIGNING_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Version prüfen
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version muss die Form 1.2.3 haben (erhalten: '$VERSION')"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION existiert bereits"; exit 1
          fi

      - name: Signierzertifikat einrichten
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk '/\)/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then echo "::error::Kein Zertifikat im Secret gefunden"; exit 1; fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signiere mit Zertifikat $IDENTITY"

      - name: Hinweis ohne Zertifikat
        if: env.HAS_CERT != 'true'
        run: echo "::warning::Kein SIGNING_CERT_P12-Secret – Ad-hoc-Signatur. Die Bedienungshilfen-Freigabe muss dann nach jedem Update neu erteilt werden."

      - name: App bauen
        run: ./Scripts/build_app.sh "$VERSION" "${{ github.run_number }}"

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          ARGS=(--target "$GITHUB_SHA" --title "Display Manager $VERSION")
          if [ -n "$NOTES" ]; then ARGS+=(--notes "$NOTES"); else ARGS+=(--generate-notes); fi
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "v$VERSION" build/Display-Manager.zip build/Display-Manager.zip.sha256 "${ARGS[@]}"
